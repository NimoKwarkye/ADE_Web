<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ADE Simulator</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #181c20;
        color: #ddd;
        font: 15px system-ui;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #181c20;
        z-index: 2;
      }
      #status[hidden] {
        display: none;
      }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon_32.png?v=2825445517bb3ad9" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon_16.png?v=2825445517bb3ad9" />
    <link rel="icon" sizes="any" href="icons/app.ico?v=2825445517bb3ad9" />
  </head>
  <body>
    <div id="status" role="status">Loading ADE Simulator...</div>
    <canvas
      id="canvas"
      tabindex="0"
      aria-label="ADE Simulator desktop interface"
      oncontextmenu="event.preventDefault()"
    ></canvas>
    <script>
      window.coi = {
        coepCredentialless: () => false,
        doReload: async () => {
          await navigator.serviceWorker.ready;
          // Activation alone does not mean this page is controlled yet.
          if (!navigator.serviceWorker.controller) {
            await new Promise((resolve) => {
              const controlled = () => {
                if (navigator.serviceWorker.controller) {
                  navigator.serviceWorker.removeEventListener("controllerchange", controlled);
                  resolve();
                }
              };
              navigator.serviceWorker.addEventListener("controllerchange", controlled);
              controlled();
            });
          }
          location.reload();
        },
      };
    </script>
    <script src="coi-serviceworker.js"></script>
    <script>
      const canvas = document.getElementById("canvas"),
        status = document.getElementById("status");
      function resize() {
        canvas.width = Math.max(320, innerWidth);
        canvas.height = Math.max(240, innerHeight);
      }
      resize();
      addEventListener("resize", resize);
      const appBuild = "2825445517bb3ad9";
      var Module = {
        locateFile: (file, prefix) => `${prefix || ""}${file}?v=${appBuild}`,
        canvas,
        preRun: [
          () => {
            FS.mkdirTree("/settings");
            FS.mkdirTree("/exports");
            FS.mkdirTree("/imports");
            try {
              const ini = localStorage.getItem("ade-imgui-layout");
              if (ini) FS.writeFile("/settings/imgui.ini", ini);
            } catch (error) {
              console.warn(error);
            }
          },
        ],
        onRuntimeInitialized: () => {
          status.hidden = true;
          canvas.focus();
          setInterval(() => {
            try {
              if (FS.analyzePath("/settings/imgui.ini").exists)
                localStorage.setItem(
                  "ade-imgui-layout",
                  FS.readFile("/settings/imgui.ini", { encoding: "utf8" }),
                );
            } catch (error) {}
          }, 2000);
        },
        printErr: (text) => console.error(text),
        onAbort: (reason) => {
          status.hidden = false;
          status.textContent = "ADE Simulator could not start: " + reason;
        },
      };
      if (!crossOriginIsolated) {
        status.textContent =
          "Preparing browser support. The page may reload once. If it does not start, enable service workers and use HTTPS (or localhost).";
      } else {
        const script = document.createElement("script");
        script.src = `ade.js?v=${appBuild}`;
        script.onerror = () => {
          status.textContent = "Build files are missing. Run build.py first.";
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
